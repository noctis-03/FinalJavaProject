<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>발표 자료 모음</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Noto+Serif+KR:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #F5F0E8;
      --warm-white: #FAF8F4;
      --orange: #D97757;
      --orange-soft: #E8896A;
      --orange-pale: #F5E6DF;
      --charcoal: #2C2825;
      --muted: #8C7E72;
      --border: #E2D9CE;
      --border-hover: #C4A897;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Serif KR', Georgia, serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }

    .wrapper {
      max-width: 860px;
      margin: 0 auto;
      padding: 80px 32px 120px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
    }

    .section-label {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .card {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 18px 20px;
      margin: 8px 0;
      background: var(--warm-white);
      border: 1px solid var(--border);
      border-radius: 10px;
      text-decoration: none;
      color: var(--charcoal);
      font-size: 14px;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--orange);
      transform: scaleY(0);
      transform-origin: bottom;
      transition: transform 0.25s ease;
      border-radius: 0 2px 2px 0;
    }

    .card:hover {
      border-color: var(--border-hover);
      background: #fff;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(44, 40, 37, 0.08);
    }

    .card:hover::before {
      transform: scaleY(1);
    }

    .card-icon {
      width: 34px;
      height: 34px;
      background: var(--orange-pale);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
      transition: background 0.25s;
    }

    .card:hover .card-icon {
      background: var(--orange);
    }

    .card-body {
      flex: 1;
    }

    .card-title {
      font-weight: 500;
      color: var(--charcoal);
      margin-bottom: 3px;
      font-size: 14px;
    }

    .card-desc {
      font-size: 12px;
      color: var(--muted);
      font-weight: 300;
    }

    .card-arrow {
      font-size: 12px;
      color: var(--border-hover);
      align-self: center;
      transition: transform 0.2s, color 0.2s;
    }

    .card:hover .card-arrow {
      transform: translateX(3px);
      color: var(--orange);
    }

    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; gap: 36px; }
      .wrapper { padding: 60px 20px 80px; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="grid">
      <div class="section">
        <div class="section-label">발표자료</div>

        <a class="card" href="docs/project_overview/project-overview.pdf">
          <div class="card-icon">📄</div>
          <div class="card-body">
            <div class="card-title">프로젝트 개요</div>
            <div class="card-desc">프로젝트 전체 개요 및 방향성</div>
          </div>
          <span class="card-arrow">→</span>
        </a>
      </div>

      <div class="section">
        <div class="section-label">AI 사용 내역</div>
      </div>
    </div>
  </div>
</body>
</html>
