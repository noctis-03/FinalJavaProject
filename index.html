<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>발표 자료 모음</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Apple SD Gothic Neo', sans-serif;
      max-width: 1000px;
      margin: 60px auto;
      padding: 20px;
      background: #fafafa;
      color: #222;
    }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 32px; }

    .container { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }

    .section h2 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #999;
      margin-bottom: 12px;
    }

    .card {
      display: block;
      padding: 14px 16px;
      margin: 6px 0;
      background: #fff;
      border: 1px solid #eee;
      border-radius: 8px;
      text-decoration: none;
      color: #222;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: #999; }
  </style>
</head>
<body>

  <h1>발표 자료 모음</h1>

  <div class="container">
    <div class="section">
      <h2>발표자료</h2>
      <a class="card" href="docs/project_overview/project-overview.pdf">📄 프로젝트 개요</a>
    </div>

    <div class="section">
      <h2>AI 사용 내역</h2>
      <a class="card" href="#">💬 AI 활용 내역</a>
    </div>
  </div>

</body>
</html>
